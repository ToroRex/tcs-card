<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TCS STAFF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #202020 0%, #0d0d0d 45%, #050505 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 5px;
      font-weight: 600;
    }

    .brand p {
      margin: 8px 0 0;
      color: #999;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .card {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #303030;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    .section-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #aaa;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #383838;
      background: #101010;
      color: #fff;
      outline: none;
      font-size: 16px;
      text-align: center;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      cursor: not-allowed;
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      background: #202020;
      color: #fff;
      border: 1px solid #3a3a3a;
    }

    .danger {
      background: #1b1b1b;
      color: #aaa;
      border: 1px solid #333;
    }

    .hidden {
      display: none !important;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
      color: #aaa;
    }

    .error {
      color: #ff7b7b;
    }

    .success {
      color: #a8e6a3;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      margin-top: 15px;
    }

    .scanner-info {
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
      margin: 15px 0 5px;
    }

    .member-box {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #353535;
      border-radius: 16px;
      background: #111;
    }

    .member-label {
      color: #888;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 12px;
    }

    .member-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 600;
    }

    .member-id {
      font-size: 13px;
      color: #aaa;
      word-break: break-all;
    }

    .visits {
      font-size: 28px;
      margin-top: 5px;
    }

    .confirm {
      background: #fff;
      color: #000;
      margin-top: 20px;
    }

    .logout {
      margin-top: 25px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 20px;
      }
    }
  </style>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>THE CLUB STUDIO</h1>
      <p>TCS STAFF</p>
    </div>


    <!-- LOGIN -->

    <div id="loginCard" class="card">

      <div class="section-title">
        ACCESO PRIVADO
      </div>

      <input
        type="password"
        id="codigo"
        placeholder="Código de acceso"
        autocomplete="off"
      >

      <button
        class="primary"
        onclick="iniciarSesion()">
        ENTRAR
      </button>

      <div
        id="loginMessage"
        class="message">
      </div>

    </div>


    <!-- PANEL STAFF -->

    <div id="staffCard" class="card hidden">

      <div class="section-title">
        ESCÁNER QR
      </div>

      <div class="scanner-info">
        Pide al cliente que muestre su<br>
        <strong>MI QR</strong> de The Club Studio.
      </div>

      <div id="reader"></div>

      <div
        id="scannerMessage"
        class="message">
      </div>


      <!-- CLIENTE -->

      <div
        id="memberBox"
        class="member-box hidden">

        <div class="member-label">
          CLIENTE
        </div>

        <div
          id="memberName"
          class="member-value">
          —
        </div>


        <div class="member-label">
          MEMBER ID
        </div>

        <div
          id="memberID"
          class="member-value member-id">
          —
        </div>


        <div class="member-label">
          VISITAS ACTUALES
        </div>

        <div
          id="memberVisits"
          class="member-value visits">
          —
        </div>


        <button
          class="confirm"
          onclick="confirmarVisita()">
          CONFIRMAR VISITA
        </button>


        <button
          class="secondary"
          onclick="reiniciarEscaner()">
          ESCANEAR OTRO
        </button>

      </div>


      <button
        class="danger logout"
        onclick="cerrarSesion()">
        CERRAR SESIÓN
      </button>

    </div>

  </div>


<script>

  const API_URL =
    https://script.google.com/macros/s/AKfycbwgGNhzJBSxKR7ijdlM_ta5PegQR2lM5hbAPal1rMfV-yrbA_kzSfCC3fL20kDYLotq/exec
  let staffCode = "";
  let scanner = null;
  let scannerActivo = false;
  let clienteActual = null;


  /* =====================================================
     LOGIN
     ===================================================== */

  function iniciarSesion() {

    const codigo =
      document.getElementById("codigo").value.trim();

    const message =
      document.getElementById("loginMessage");


    if (!codigo) {

      message.textContent =
        "Introduce el código de acceso.";

      message.className =
        "message error";

      return;
    }


    message.textContent =
      "Verificando...";

    message.className =
      "message";


    fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        accion: "staff_login",
        codigo: codigo

      })

    })

    .then(response => response.json())

    .then(data => {

      if (
        data.ok &&
        data.resultado &&
        data.resultado.autorizado
      ) {

        staffCode = codigo;


        sessionStorage.setItem(
          "tcs_staff_authorized",
          "true"
        );


        document
          .getElementById("loginCard")
          .classList
          .add("hidden");


        document
          .getElementById("staffCard")
          .classList
          .remove("hidden");


        iniciarEscaner();

      } else {

        message.textContent =
          "Código de acceso incorrecto.";

        message.className =
          "message error";

      }

    })

    .catch(error => {

      console.error(error);

      message.textContent =
        "No se pudo conectar con el servidor.";

      message.className =
        "message error";

    });

  }


  /* =====================================================
     INICIAR ESCÁNER
     ===================================================== */

  function iniciarEscaner() {

    if (scannerActivo) return;


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      qrDetectado,

      error => {
        // Errores normales de lectura ignorados.
      }

    )

    .then(() => {

      scannerActivo = true;


      document
        .getElementById("scannerMessage")
        .textContent =
        "Apunta la cámara al Member QR.";

    })

    .catch(error => {

      console.error(error);


      const message =
        document.getElementById(
          "scannerMessage"
        );


      message.textContent =
        "No se pudo iniciar la cámara. Revisa los permisos del navegador.";

      message.className =
        "message error";

    });

  }


  /* =====================================================
     QR DETECTADO
     ===================================================== */

  function qrDetectado(decodedText) {

    if (!decodedText) return;

    if (clienteActual) return;


    const memberID =
      decodedText.trim();


    detenerEscaner();


    document
      .getElementById("scannerMessage")
      .textContent =
      "QR detectado. Verificando membresía...";


    buscarMiembro(memberID);

  }


  /* =====================================================
     DETENER ESCÁNER
     ===================================================== */

  function detenerEscaner() {

    if (!scanner || !scannerActivo) {
      return;
    }


    scanner.stop()

      .then(() => {

        scanner.clear();

        scannerActivo = false;

      })

      .catch(error => {

        console.error(error);

        scannerActivo = false;

      });

  }


  /* =====================================================
     BUSCAR MEMBER ID
     ===================================================== */

  function buscarMiembro(memberID) {

    fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        accion: "staff_buscar",

        codigo: staffCode,

        memberID: memberID

      })

    })

    .then(response => response.json())

    .then(data => {

      console.log("Respuesta STAFF:", data);


      if (!data.ok) {

        const message =
          document.getElementById(
            "scannerMessage"
          );


        message.textContent =
          data.error ||
          "No se encontró esta membresía.";

        message.className =
          "message error";


        setTimeout(() => {

          reiniciarEscaner();

        }, 1800);


        return;
      }


      /*
       * IMPORTANTE:
       * Apps Script devuelve los datos
       * dentro de data.resultado.
       */

      const cliente =
        data.resultado;


      if (!cliente) {

        throw new Error(
          "El servidor no devolvió los datos de la membresía."
        );

      }


      clienteActual =
        cliente;


      document
        .getElementById("memberName")
        .textContent =
        cliente.nombre;


      document
        .getElementById("memberID")
        .textContent =
        cliente.id;


      document
        .getElementById("memberVisits")
        .textContent =
        cliente.visitas;


      document
        .getElementById("memberBox")
        .classList
        .remove("hidden");


      document
        .getElementById("scannerMessage")
        .textContent =
        "Membresía identificada. Confirma la visita.";


      document
        .getElementById("scannerMessage")
        .className =
        "message success";

    })

    .catch(error => {

      console.error(error);


      const message =
        document.getElementById(
          "scannerMessage"
        );


      message.textContent =
        error.message ||
        "Error al consultar la membresía.";

      message.className =
        "message error";

    });

  }


  /* =====================================================
     CONFIRMAR VISITA
     ===================================================== */

  function confirmarVisita() {

    if (!clienteActual) {
      return;
    }


    const message =
      document.getElementById(
        "scannerMessage"
      );


    const confirmButton =
      document.querySelector(".confirm");


    confirmButton.disabled = true;


    message.textContent =
      "Registrando visita...";

    message.className =
      "message";


    fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        accion: "staff_registrar",

        codigo: staffCode,

        memberID: clienteActual.id

      })

    })

    .then(response => response.json())

    .then(data => {

      console.log(
        "Respuesta registro:",
        data
      );


      if (!data.ok) {

        confirmButton.disabled = false;


        message.textContent =
          data.error ||
          "No se pudo registrar la visita.";

        message.className =
          "message error";

        return;
      }


      const resultado =
        data.resultado;


      /*
       * VISITA YA REGISTRADA HOY
       */

      if (
        resultado.estado ===
        "ya_registrado"
      ) {

        message.textContent =
          "Esta visita ya fue registrada hoy.";

        message.className =
          "message error";


        confirmButton.disabled = false;

        return;
      }


      /*
       * CORTE GRATIS
       */

      if (
        resultado.estado ===
        "corte_gratis"
      ) {

        document
          .getElementById("memberVisits")
          .textContent = "0";


        message.textContent =
          "🎉 ¡Visita #10! Corte gratis desbloqueado.";

        message.className =
          "message success";

      }

      /*
       * VISITA NORMAL
       */

      else {

        document
          .getElementById("memberVisits")
          .textContent =
          resultado.visitas;


        message.textContent =
          "✓ Visita registrada correctamente.";

        message.className =
          "message success";

      }


      setTimeout(() => {

        clienteActual = null;


        document
          .getElementById("memberBox")
          .classList
          .add("hidden");


        confirmButton.disabled = false;


        reiniciarEscaner();

      }, 2200);

    })

    .catch(error => {

      console.error(error);


      confirmButton.disabled = false;


      message.textContent =
        error.message ||
        "No se pudo conectar con el servidor.";

      message.className =
        "message error";

    });

  }


  /* =====================================================
     ESCANEAR OTRO
     ===================================================== */

  function reiniciarEscaner() {

    clienteActual = null;


    document
      .getElementById("memberBox")
      .classList
      .add("hidden");


    document
      .getElementById("scannerMessage")
      .textContent =
      "Apunta la cámara al Member QR.";


    document
      .getElementById("scannerMessage")
      .className =
      "message";


    if (!scannerActivo) {

      iniciarEscaner();

    }

  }


  /* =====================================================
     CERRAR SESIÓN
     ===================================================== */

  function cerrarSesion() {

    detenerEscaner();


    staffCode = "";
    clienteActual = null;


    sessionStorage.removeItem(
      "tcs_staff_authorized"
    );


    document
      .getElementById("staffCard")
      .classList
      .add("hidden");


    document
      .getElementById("loginCard")
      .classList
      .remove("hidden");


    document
      .getElementById("codigo")
      .value = "";


    document
      .getElementById("loginMessage")
      .textContent = "";

  }


  /* =====================================================
     CARGA INICIAL
     ===================================================== */

  window.addEventListener(
    "load",
    () => {

      sessionStorage.removeItem(
        "tcs_staff_authorized"
      );

    }
  );

</script>

</body>
</html>
