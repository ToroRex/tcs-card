<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0e">
  <title>TCS STAFF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #1b1d20 0%, #0b0c0e 45%, #050506 100%);
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .brand {
      letter-spacing: 5px;
      font-size: 13px;
      color: #a9adb2;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 10px;
      color: #8e9399;
      font-size: 14px;
    }

    .card {
      margin-top: 30px;
      background: rgba(22, 24, 27, 0.92);
      border: 1px solid #303338;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .lock {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .label {
      display: block;
      text-align: left;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #92979d;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #383b40;
      background: #0e0f11;
      color: white;
      outline: none;
      font-size: 16px;
      text-align: center;
    }

    input:focus {
      border-color: #858a90;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #f1f1f1;
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.5;
      color: #777c82;
    }

    #status {
      margin-top: 16px;
      min-height: 20px;
      font-size: 13px;
      color: #aeb2b7;
    }

    .footer {
      margin-top: 25px;
      font-size: 11px;
      color: #55595e;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">THE CLUB STUDIO</div>

    <h1>TCS STAFF</h1>

    <div class="subtitle">
      Panel privado del equipo
    </div>

    <section class="card">

      <div class="lock">◈</div>

      <label class="label" for="staffKey">
        ACCESO DEL EQUIPO
      </label>

      <input
        id="staffKey"
        type="password"
        placeholder="Código de acceso"
        autocomplete="off"
      >

      <button onclick="entrar()">
        ENTRAR
      </button>

      <div id="status"></div>

      <div class="note">
        Este acceso es exclusivo para el equipo de
        The Club Studio.
      </div>

    </section>

    <div class="footer">
      PRIVATE STAFF AREA · TCS
    </div>

  </main>

  <script>
    function entrar() {
      const key = document.getElementById("staffKey").value.trim();
      const status = document.getElementById("status");

      if (!key) {
        status.textContent = "Ingresa el código de acceso.";
        return;
      }

      /*
        POR AHORA SOLO ESTAMOS CREANDO LA PANTALLA.
        La autenticación real se conectará después
        con Google Apps Script.

        NO pongas aquí una contraseña real todavía.
      */

      status.textContent =
        "Panel preparado. La autenticación segura se conectará en el siguiente paso.";
    }
  </script>

</body>
</html>
